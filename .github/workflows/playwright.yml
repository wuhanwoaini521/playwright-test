name: Playwright Tests 🎭

on:
  # 🔧 demo 阶段仅手动触发（避免频繁自动执行浪费资源）。
  # 本地 / PR 验证请使用: uv run pytest
  workflow_dispatch:
    inputs:
      browser:
        description: '选择要运行的浏览器'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all  # 全部浏览器

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 多浏览器（选择 all 时运行全部浏览器）
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(github.event.inputs.browser == 'all' && '["chromium","firefox","webkit"]' || format('["{0}"]', github.event.inputs.browser)) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 🔧
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv 📦
        run: pip install uv

      - name: Cache uv environment 💾
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies 🧰
        run: |
          uv sync --python 3.12
          uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests 🧪
        run: uv run pytest --browser=${{ matrix.browser }} -n auto --tracing=retain-on-failure

      - name: Upload Playwright artifacts 📤
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload Allure report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

      - name: Cache Playwright browsers 💾
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ matrix.browser }}-${{ runner.os }}
